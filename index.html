<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laperouse-Shipping: лоти з Китаю</title>
<script>try{var t=JSON.parse(localStorage.getItem('theme'));if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--ink:#111111;--mut:#6d6b66;--card:#ffffff;--acc:#111111;--line:#dcdad3;--fg:#faf9f6;--serif:'Cormorant Garamond','Didot','Bodoni 72',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#efede8;--mut:#9b9992;--card:#1b1b1b;--acc:#efede8;--line:#333330;--fg:#121212}}
:root[data-theme="dark"]{--bg:#121212;--ink:#efede8;--mut:#9b9992;--card:#1b1b1b;--acc:#efede8;--line:#333330;--fg:#121212}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif}
header,main,footer{max-width:1000px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
nav{display:flex;align-items:center;gap:18px;font-weight:600;font-size:15px}
nav a{cursor:pointer}nav a:hover{text-decoration:underline;text-underline-offset:4px}
.logo{font:500 21px/1 var(--serif);letter-spacing:.34em;text-transform:uppercase;cursor:pointer;text-align:center}
.logo span{display:block;font-size:10px;letter-spacing:.62em;margin-top:6px;color:var(--mut);padding-left:.62em}
.logo b{font-weight:500;padding-left:.34em;display:block}
.tg{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:17px;line-height:1}
h1,h2{font-family:var(--serif);font-weight:500;line-height:1.05}h1{font-size:clamp(36px,9vw,64px);margin:.4em 0}h2{font-size:30px}
.sub{color:var(--mut);font-size:18px;max-width:44ch}.mut{color:var(--mut)}.warn{color:#c0392b;font-weight:600}
.about{max-width:62ch;font-size:17px}.about p{margin:0 0 1em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;border-top:1px solid var(--ink);padding-top:8px;font-weight:600}.steps li:before{content:counter(s)". ";font-family:var(--serif);font-size:20px}
.steps li small{display:block;font-weight:400;color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs a{padding:6px 14px;border:1px solid var(--line);border-radius:99px;font-size:14px;cursor:pointer}.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);padding:8px;border-radius:18px;cursor:pointer}.card h3{font-size:14px;margin:8px 4px 2px}.card p{margin:0 4px 4px;font-weight:700}
.im{aspect-ratio:1;width:100%;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font:600 52px var(--serif);color:rgba(0,0,0,.14);object-fit:cover}
.th{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.th img{width:56px;height:56px;object-fit:cover;border-radius:10px;cursor:pointer}
.lot{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:700px){.lot{grid-template-columns:1fr}}
.price{font:600 36px var(--serif);margin:6px 0}
input,select,textarea,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{display:inline-block;background:var(--acc);color:var(--fg);border:0;font-weight:700;padding:12px 22px;cursor:pointer;margin-top:10px;width:auto;border-radius:99px;text-decoration:none}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.form{display:grid;gap:10px;max-width:500px}.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.line{display:grid;grid-template-columns:48px 1fr auto 28px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.line .im{width:48px;height:48px;font-size:18px;padding:4px;border-radius:10px}
.code{font:600 40px var(--serif);letter-spacing:2px;margin:8px 0;word-break:break-all}
a,.lnk{cursor:pointer}
footer{color:var(--mut);font-size:14px;padding-bottom:40px}
</style></head><body>
<header><span class="logo" onclick="go('')"><b>Laperouse</b><span>Shipping</span></span>
<nav><a onclick="go('')">Каталог</a><a onclick="go('about')">Про нас</a><a onclick="go('cart')">Кошик <span id="cc"></span></a><button class="tg" id="tb" aria-label="Змінити тему" title="Світла / темна тема"></button></nav></header>
<main id="app"></main>
<footer>Ціна вже включає доставку з Китаю. Доставку по Україні оплачуєте при отриманні.</footer>
<script src="lots.js"></script>
<script>
var S=window.SHOP;
if(!S){document.getElementById('app').innerHTML='<h1>Немає файлу lots.js</h1><p>Завантажте lots.js у ту саму папку, де лежить index.html.</p>';throw 0}

// ====== ТЕКСТ ВКЛАДКИ «ПРО НАС»: замініть на свій (можна використовувати <p>...</p>) ======
var ABOUT='<p>Тут буде опис про нас. Розкажіть, хто ви, як давно працюєте і чим відрізняється ваш сервіс.</p>';
// ======================================================================================

// тема: світла / темна
function curTheme(){var t=document.documentElement.getAttribute('data-theme');return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function paintTheme(){document.getElementById('tb').textContent=curTheme()=='dark'?'☀':'☾'}
document.getElementById('tb').onclick=function(){var n=curTheme()=='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',JSON.stringify(n))}catch(e){}paintTheme()};
paintTheme();

// розбиває "40 41 42" або "S M L" на окремі розміри; назви на кшталт "iPhone 14" не чіпає
function fixList(a){var SZ=/^(\d{1,3}([.,]\d)?|\d?X{0,3}[SML])$/i,o=[];(a||[]).forEach(function(x){String(x).split(/[;\n]+/).forEach(function(p){p=p.trim();if(!p)return;var t=p.split(/\s+/);if(t.length>1&&t.every(function(w){return SZ.test(w)}))o=o.concat(t);else o.push(p)})});return o}
var CONFIG=S.CONFIG,CATS=S.CATS,LOTS=S.LOTS.filter(function(l){return !l.hidden});
LOTS.forEach(function(l){l.sizes=fixList(l.sizes);l.colors=fixList(l.colors)});
var byId=function(id){return LOTS.filter(function(l){return l.id==id})[0]};
var BG=['#e6e3da','#efece4','#dcdad3','#e9e4dc'];
// вага: з лота, а якщо порожньо, типова по категорії; плюс запас на упаковку Meest
var price=function(l){var kg=(l.kg||(S.DEFKG||{})[l.cat]||0.5)*(1+(CONFIG.weightBuffer||0)/100);return Math.ceil((l.cny*CONFIG.cny*(1+CONFIG.markup/100)+kg*CONFIG.shipUsdPerKg*CONFIG.usd)/10)*10};
var uah=function(n){return n.toLocaleString('uk-UA')+' ₴'};
var pt=function(n){return (CONFIG.approx?'≈ ':'')+uah(n)};
function im(l){return l.imgs&&l.imgs[0]?'<img class="im" loading="lazy" alt="" src="'+l.imgs[0]+'">':'<div class="im" style="background:'+BG[l.id%4]+'">'+l.name.slice(0,2)+'</div>'}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var cart=(store('cart')||[]).filter(function(c){return byId(c.id)}),cat='',q='',last=store('last');
function save(){store('cart',cart);document.getElementById('cc').textContent=cart.length?'('+cart.length+')':''}
function go(h){location.hash=h}
function thumbs(l){return l.imgs&&l.imgs.length>1?'<div class="th">'+l.imgs.map(function(u){return '<img alt="" src="'+u+'" onclick="document.querySelector(\'.lot .im\').src=this.src">'}).join('')+'</div>':''}
function card(l){return '<div class="card" onclick="go(\'lot-'+l.id+'\')">'+im(l)+'<h3>'+l.name+'</h3><p>'+pt(price(l))+'</p></div>'}
function code(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return 'CN-'+s}
function render(){
  var h=location.hash.slice(1),a=document.getElementById('app'),m;save();
  if(m=h.match(/^lot-(\d+)$/)){var l=byId(m[1]);if(!l){go('');return}
    var o=function(id,t,arr){return arr.length?'<label>'+t+'<select id="'+id+'">'+arr.map(function(x){return '<option>'+x+'</option>'}).join('')+'</select></label>':''};
    a.innerHTML='<div class="lot"><div>'+im(l)+thumbs(l)+'</div><div><h1 style="font-size:36px">'+l.name+'</h1><p class="price">'+pt(price(l))+'</p><p class="mut">Доставка з Китаю включена. Орієнтовно 14–25 днів.'+(CONFIG.approx?' Ціна орієнтовна, точну підтвердимо в Telegram.':'')+'</p><p>'+l.desc+'</p><div class="form">'+o('sz','Розмір',l.sizes)+o('cl','Колір',l.colors)+'<button class="btn" id="add">Додати в кошик</button></div></div></div>';
    document.getElementById('add').onclick=function(){var v=function(i){var e=document.getElementById(i);return e?e.value:''};cart.push({id:l.id,sz:v('sz'),cl:v('cl'),qty:1});go('cart')};
  }else if(h=='about'){
    a.innerHTML='<h1>Про нас</h1><div class="about">'+ABOUT+'</div><p><a class="btn" target="_blank" rel="noopener" href="https://t.me/'+CONFIG.tg+'">Написати нам у Telegram</a></p>';
  }else if(h=='cart'){
    if(!cart.length){a.innerHTML='<h1>Кошик</h1><p>Порожньо. <a class="lnk" onclick="go(\'\')"><u>Обрати лот</u></a></p>';return}
    var s=0;a.innerHTML='<h1>Кошик</h1>'+cart.map(function(c,i){var l=byId(c.id);s+=price(l)*c.qty;return '<div class="line">'+im(l)+'<div><b>'+l.name+'</b><br><span class="mut">'+c.sz+' '+c.cl+'</span></div><span>'+pt(price(l)*c.qty)+'</span><a class="lnk" aria-label="Видалити" onclick="cart.splice('+i+',1);render()">×</a></div>'}).join('')+'<p><b>Разом: '+pt(s)+'</b> <span class="mut">(доставка з Китаю включена'+(CONFIG.approx?', ціна орієнтовна':'')+')</span></p>'+
    '<form class="form" id="f"><h2>Ваші дані</h2><label>Імʼя та прізвище<input id="fn" required></label><label>Телефон<input id="fp" required placeholder="+380..."></label><label>Місто і відділення пошти<input id="fc" required></label><button class="btn">Отримати номер замовлення</button></form>';
    document.getElementById('f').onsubmit=function(e){e.preventDefault();
      var c=code(),lines=cart.map(function(x){var l=byId(x.id);return '• '+l.name+' ('+[x.sz,x.cl].filter(Boolean).join(', ')+') x'+x.qty+' — '+pt(price(l)*x.qty)});
      var msg='Замовлення '+c+'\n'+lines.join('\n')+'\nРазом: '+pt(s)+'\n\n'+document.getElementById('fn').value+'\n'+document.getElementById('fp').value+'\n'+document.getElementById('fc').value;
      last={code:c,msg:msg};store('last',last);cart=[];save();go('done')};
  }else if(h=='done'&&last){
    a.innerHTML='<h1>Ваше замовлення</h1><p class="code">'+last.code+'</p><p>Надішліть цей номер нам у Telegram. Ми підтвердимо замовлення і надішлемо реквізити для оплати. Після оплати відправимо трекінг протягом 2–5 днів.</p><textarea id="mt" rows="8" readonly></textarea><p><a class="btn" id="tg" target="_blank" rel="noopener">Відправити в Telegram</a> <button class="btn alt" id="cp">Скопіювати текст</button></p><p id="ok" class="mut"></p>';
    document.getElementById('mt').value=last.msg;
    document.getElementById('tg').href='https://t.me/'+CONFIG.tg+'?text='+encodeURIComponent(last.msg);
    document.getElementById('cp').onclick=function(){var t=document.getElementById('mt');t.select();try{navigator.clipboard.writeText(last.msg)}catch(e){document.execCommand('copy')}document.getElementById('ok').textContent='Скопійовано. Вставте в чат з нами.'};
  }else{
    a.innerHTML='<h1>Китай без<br>головного болю</h1><p class="sub">Обираєте лот, отримуєте номер замовлення і надсилаєте його нам у Telegram. Ми викупаємо і веземо.</p><ol class="steps"><li>Оберіть лот</li><li>Отримайте номер замовлення</li><li>Надішліть його нам у Telegram</li><li>Оплатіть замовлення</li><li>Отримайте трекінг<small>протягом 2–5 днів</small></li></ol><div class="form" style="margin-top:16px"><input id="q" placeholder="Пошук" value="'+q.replace(/"/g,'')+'"></div><div class="tabs"><a class="'+(cat?'':'on')+'" onclick="cat=\'\';render()">Усе</a>'+Object.keys(CATS).map(function(k){return '<a class="'+(cat==k?'on':'')+'" onclick="cat=\''+k+'\';render()">'+CATS[k]+'</a>'}).join('')+'</div><div class="grid" id="g"></div>';
    var draw=function(){var r=LOTS.filter(function(l){return(!cat||l.cat==cat)&&l.name.toLowerCase().indexOf(q.toLowerCase())>-1});document.getElementById('g').innerHTML=r.map(card).join('')||'<p>Нічого не знайдено. Спробуйте іншу категорію.</p>'};
    document.getElementById('q').oninput=function(e){q=e.target.value;draw()};draw();
  }
  scrollTo(0,0);
}
addEventListener('hashchange',render);render();
</script></body></html>

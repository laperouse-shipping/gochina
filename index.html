<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Laperouse Shipping — товари з Китаю: легко, швидко, доступно, без переплат.">
<meta property="og:title" content="Laperouse Shipping"><meta property="og:description" content="Товари з Китаю — легко, швидко, доступно, без переплат.">

<script>try{var t=JSON.parse(localStorage.getItem('theme'));if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--ink:#111111;--mut:#6d6b66;--card:#ffffff;--acc:#111111;--line:#dcdad3;--fg:#faf9f6;--serif:'Cormorant Garamond','Didot','Bodoni 72',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#121212;--ink:#efede8;--mut:#9b9992;--card:#1b1b1b;--acc:#efede8;--line:#333330;--fg:#121212}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif}
header,main,footer{max-width:1000px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-weight:600;font-size:15px}
nav a{cursor:pointer}nav a:hover{text-decoration:underline;text-underline-offset:4px}
.logo{font:500 34px/1 var(--serif);letter-spacing:.34em;text-transform:uppercase;cursor:pointer;text-align:center}
.logo span{display:block;font-size:16px;letter-spacing:.62em;margin-top:8px;color:var(--mut);padding-left:.62em}
.logo b{font-weight:500;padding-left:.34em;display:block}
.tg{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:17px;line-height:1}
h1,h2{font-family:var(--serif);font-weight:500;line-height:1.05}h1{font-size:clamp(36px,9vw,64px);margin:.4em 0}h2{font-size:30px}
.cap{color:var(--mut);opacity:.85;font-size:13px;letter-spacing:.28em;text-transform:uppercase;margin:-.6em 0 1.2em}.sub{color:var(--mut);font-size:18px;max-width:44ch}.mut{color:var(--mut)}.warn{color:#c0392b;font-weight:600}
.about{max-width:62ch;font-size:17px}.about p{margin:0 0 1em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;border-top:1px solid var(--ink);padding-top:8px;font-weight:600}.steps li:before{content:counter(s)". ";font-family:var(--serif);font-size:20px}
.steps li small{display:block;font-weight:400;color:var(--mut)}
@media(max-width:700px){.steps{grid-template-columns:1fr;justify-items:center;text-align:center}.steps li{width:100%;max-width:300px}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs a{padding:6px 14px;border:1px solid var(--line);border-radius:99px;font-size:14px;cursor:pointer}.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);padding:10px;border-radius:28px;cursor:pointer}.card h3{font-size:14px;margin:8px 4px 2px}.card p{margin:0 4px 4px;font-weight:700}
.im{aspect-ratio:1;width:100%;border-radius:20px;display:flex;align-items:flex-end;padding:8px;font:600 52px var(--serif);color:rgba(0,0,0,.14);object-fit:cover}
.th{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.th img{width:56px;height:56px;object-fit:cover;border-radius:16px;cursor:pointer}
.lot{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:700px){.lot{grid-template-columns:1fr}}
.price{font:600 36px var(--serif);margin:6px 0}
input,select,textarea,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:100%}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{display:inline-block;background:var(--acc);color:var(--fg);border:0;font-weight:700;padding:12px 22px;cursor:pointer;margin-top:10px;width:auto;border-radius:99px;text-decoration:none}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.form{display:grid;gap:10px;max-width:500px}.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.line{display:grid;grid-template-columns:48px 1fr auto 28px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.line .im{width:48px;height:48px;font-size:18px;padding:4px;border-radius:16px}
.code{font:600 40px var(--serif);letter-spacing:2px;margin:8px 0;word-break:break-all}
a,.lnk{cursor:pointer}
.rev{border:1px solid var(--line);border-radius:24px;padding:14px 16px;background:var(--card);margin:10px 0;max-width:640px}.rev .st{letter-spacing:2px}.rev p{margin:6px 0}.rev .th img{width:84px;height:84px}
.heart{float:right;font-size:20px;line-height:1;margin:6px 6px 0 0;cursor:pointer;color:var(--mut)}.heart.on{color:#c0392b}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin:4px 4px 0}.card.out{opacity:.55}
details{border:1px solid var(--line);border-radius:18px;padding:10px 16px;background:var(--card);margin:8px 0;max-width:640px}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row .btn{margin-top:6px}select.srt{width:auto;padding:6px 14px;border-radius:99px;font-size:14px}
footer a{text-decoration:underline;text-underline-offset:3px;margin-right:14px}
.tl{list-style:none;padding:0;margin:0 0 14px;max-width:360px}.tl li{padding:7px 0;border-bottom:1px solid var(--line);color:var(--mut)}.tl li.dn{color:var(--ink)}.tl li.cur{color:var(--ink);font-weight:700}.tl span{display:inline-block;width:22px}
footer{color:var(--mut);font-size:14px;padding-bottom:40px}
</style></head><body>
<header><span class="logo" onclick="go('')"><b>Laperouse</b><span>Shipping</span></span>
<nav><a onclick="go('')">Каталог</a><a onclick="go('about')">Про нас</a><a onclick="go('request')">Знайти товар</a><a onclick="go('track')">Трекінг</a><a onclick="go('faq')">Питання</a><a onclick="go('cart')">Кошик <span id="cc"></span></a><button class="tg" id="tb" aria-label="Змінити тему" title="Світла / темна тема"></button></nav></header>
<main id="app"></main>
<footer><div id="soc"></div>Ціна вже включає доставку з Китаю. Доставку по Україні оплачуєте при отриманні.</footer>
<script src="lots.js"></script>
<script src="reviews.js" onerror="void 0"></script>
<script src="tracking.js" onerror="void 0"></script>
<script>
var S=window.SHOP;
if(!S){document.getElementById('app').innerHTML='<h1>Немає файлу lots.js</h1><p>Завантажте lots.js у ту саму папку, де лежить index.html.</p>';throw 0}

// ====== ТЕКСТ ВКЛАДКИ «ПРО НАС»: замініть на свій (можна використовувати <p>...</p>) ======
var ABOUT='<p>Тут буде опис про нас. Розкажіть, хто ви, як давно працюєте і чим відрізняється ваш сервіс.</p>';
// ======================================================================================

// ====== FAQ: відредагуйте питання й відповіді ======
var FAQ=[['Скільки йде доставка?','Орієнтовно 14–25 днів з Китаю до відділення пошти в Україні. Трекінг надішлемо протягом 2–5 днів після оплати.'],['Як оплатити?','Після підтвердження замовлення в Telegram ми надішлемо реквізити.'],['Що по доставці по Україні?','Ціна вже включає доставку з Китаю. Доставку по Україні оплачуєте при отриманні.'],['Можна замовити товар, якого немає на сайті?','Так. Відкрийте вкладку «Знайти товар», опишіть або покажіть, що шукаєте, і ми привеземо це з Китаю.'],['Що якщо не підійшов розмір?','Напишіть нам у Telegram, розберемо ситуацію. Краще перед замовленням уточнити розмір у нас.']];
// ====== Підбір розміру (показується на сторінці лота; порожній рядок = сховати) ======
var SIZEGUIDE='<p>Китайські розміри часто менші за європейські. Якщо вагаєтесь між двома, беріть більший. Напишіть нам у Telegram, і ми допоможемо підібрати розмір за вашими замірами.</p>';
// ====== Соцмережі: ['Instagram','https://...'] ======
var SOCIAL=[];
// ====== Статистика (бачите тільки ви в #admin): URL веб-додатку Google Apps Script, див. apps-script.gs (порожньо = вимкнено) ======
var STATS='';
function track(t,p){if(!STATS||location.hash=='#admin')return;try{if(localStorage.getItem('notrack'))return;var v=localStorage.getItem('vid');if(!v){v=Math.random().toString(36).slice(2,12);localStorage.setItem('vid',v)}navigator.sendBeacon(STATS,JSON.stringify({v:v,t:t,p:p}))}catch(e){}}
document.getElementById('soc').innerHTML=SOCIAL.map(function(x){return '<a target="_blank" rel="noopener" href="'+x[1]+'">'+x[0]+'</a>'}).join('');

// тема: світла / темна
function curTheme(){var t=document.documentElement.getAttribute('data-theme');return t||'light'}
function paintTheme(){document.getElementById('tb').textContent=curTheme()=='dark'?'☀':'☾'}
document.getElementById('tb').onclick=function(){var n=curTheme()=='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',JSON.stringify(n))}catch(e){}paintTheme()};
paintTheme();

// розбиває "40 41 42" або "S M L" на окремі розміри; назви на кшталт "iPhone 14" не чіпає
function fixList(a){var SZ=/^(\d{1,3}([.,]\d)?|\d?X{0,3}[SML])$/i,o=[];(a||[]).forEach(function(x){String(x).split(/[;\n]+/).forEach(function(p){p=p.trim();if(!p)return;var t=p.split(/\s+/);if(t.length>1&&t.every(function(w){return SZ.test(w)}))o=o.concat(t);else o.push(p)})});return o}
var CONFIG=S.CONFIG,CATS=S.CATS,LOTS=S.LOTS.filter(function(l){return !l.hidden});
LOTS.forEach(function(l){l.sizes=fixList(l.sizes);l.colors=fixList(l.colors)});
var byId=function(id){return LOTS.filter(function(l){return l.id==id})[0]};
var BG=['#e6e3da','#efece4','#dcdad3','#e9e4dc'];
// вага: з лота, а якщо порожньо, типова по категорії; плюс запас на упаковку Meest
var price=function(l){var kg=(l.kg||(S.DEFKG||{})[l.cat]||0.5)*(1+(CONFIG.weightBuffer||0)/100);return Math.ceil((l.cny*CONFIG.cny*(1+CONFIG.markup/100)+kg*CONFIG.shipUsdPerKg*CONFIG.usd)/10)*10};
var uah=function(n){return n.toLocaleString('uk-UA')+' ₴'};
var pt=function(n){return (CONFIG.approx?'≈ ':'')+uah(n)};
function im(l){return l.imgs&&l.imgs[0]?'<img class="im" loading="lazy" alt="" src="'+l.imgs[0]+'">':'<div class="im" style="background:'+BG[l.id%4]+'">'+l.name.slice(0,2)+'</div>'}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var fav=store('fav')||[],sort='',STOCK=window.STOCK||{};
var cart=(store('cart')||[]).filter(function(c){return byId(c.id)}),cat='',q='',last=store('last');
function save(){store('cart',cart);document.getElementById('cc').textContent=cart.length?'('+cart.length+')':''}
function go(h){location.hash=h}
function thumbs(l){return l.imgs&&l.imgs.length>1?'<div class="th">'+l.imgs.map(function(u){return '<img alt="" src="'+u+'" onclick="document.querySelector(\'.lot .im\').src=this.src">'}).join('')+'</div>':''}
function stk(l){var t=STOCK[l.id];return t=='out'?'<span class="badge">Немає в наявності</span>':t=='low'?'<span class="badge">Закінчується</span>':''}
function toggleFav(id,ev){ev.stopPropagation();var i=fav.indexOf(id);if(i<0)fav.push(id);else fav.splice(i,1);store('fav',fav);render()}
function card(l){var on=fav.indexOf(l.id)>-1;return '<div class="card'+(STOCK[l.id]=='out'?' out':'')+'" onclick="go(\'lot-'+l.id+'\')"><span class="heart'+(on?' on':'')+'" aria-label="Обране" onclick="toggleFav('+l.id+',event)">'+(on?'♥':'♡')+'</span>'+im(l)+'<h3>'+l.name+'</h3><p>'+pt(price(l))+'</p>'+stk(l)+'</div>'}
function share(t){var u=location.href;if(navigator.share){navigator.share({title:t,url:u}).catch(function(){})}else{try{navigator.clipboard.writeText(u);alert('Посилання скопійовано')}catch(e){prompt('Скопіюйте посилання',u)}}}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var stars=function(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n)};
function revBlock(rs){if(!rs||!rs.length)return '';var avg=rs.reduce(function(a,x){return a+(+x.rating||5)},0)/rs.length;
  return '<h2 style="margin-top:32px">Відгуки <span class="mut" style="font-size:20px">★ '+avg.toFixed(1).replace('.',',')+' · '+rs.length+'</span></h2>'+rs.map(function(x){return '<div class="rev"><b>'+esc(x.name)+'</b> <span class="st">'+stars(+x.rating||5)+'</span> <span class="mut" style="font-size:13px">'+esc(x.date)+'</span><p>'+esc(x.text).replace(/\n/g,'<br>')+'</p>'+((x.imgs||[]).length?'<div class="th">'+x.imgs.map(function(u){return '<img alt="" src="'+u+'">'}).join('')+'</div>':'')+'</div>'}).join('')}
// ===== редактор відгуків (#admin) =====
var sdraft=store('stdraft')||JSON.parse(JSON.stringify(window.STOCK||{}));
var tdraft=store('trdraft')||JSON.parse(JSON.stringify(window.TRACK||{}));
function saveT(){store('trdraft',tdraft)}
function delT(h){delete tdraft[h];saveT();drawT()}
function drawT(){var e=document.getElementById('tkl');if(!e)return;var ks=Object.keys(tdraft);e.innerHTML=ks.length?ks.map(function(h){var x=tdraft[h],l=x.h[x.h.length-1];return '<div class="rev" style="padding:8px 14px"><b>'+(x.c?esc(x.c.slice(0,4)+'-'+x.c.slice(4)):'#'+h.slice(0,8))+'</b> · '+STG[l.s]+' <span class="mut">'+esc(l.d)+'</span> <span class="mut">(змін: '+x.h.length+')</span> <a class="lnk" style="float:right" onclick="delT(\''+h+'\')">Видалити ×</a></div>'}).join(''):'<p class="mut">Поки порожньо.</p>'}
var draft=store('revdraft')||JSON.parse(JSON.stringify(window.REVIEWS||{})),alot=null,apics=[];
function saveDraft(){store('revdraft',draft)}
function drawRevs(){var rs=draft[alot]||[],e=document.getElementById('rl');if(!e)return;e.innerHTML=rs.length?rs.map(function(x,i){return '<div class="rev"><b>'+esc(x.name)+'</b> <span class="st">'+stars(+x.rating||5)+'</span> <span class="mut" style="font-size:13px">'+esc(x.date)+'</span> <a class="lnk" style="float:right" onclick="delRev('+i+')">Видалити ×</a><p>'+esc(x.text)+'</p>'+((x.imgs||[]).length?'<span class="mut">фото: '+x.imgs.length+'</span>':'')+'</div>'}).join(''):'<p class="mut">Відгуків ще немає.</p>'}
function delRev(i){draft[alot].splice(i,1);saveDraft();drawRevs()}
function shrink(f,cb){var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=rd.result};rd.readAsDataURL(f)}
var ADMH='dad97183a124a1070e226e5950a565372e62c76093f94c94b2b2995824ca9ae7';
function sha(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return [].map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
function loadStats(){var e=document.getElementById('stt');if(!STATS||!e)return;var k;try{k=localStorage.getItem('skey')}catch(x){}if(!k){k=prompt('Ключ статистики (KEY з apps-script.gs)');if(!k){e.textContent='Потрібен ключ.';return}}
  fetch(STATS+'?key='+encodeURIComponent(k)).then(function(r){return r.json()}).then(function(d){if(d.error){try{localStorage.removeItem('skey')}catch(x){}e.textContent='Невірний ключ. Оновіть сторінку і введіть знову.';return}try{localStorage.setItem('skey',k)}catch(x){}
    var nm=function(id){var l=byId(id)||S.LOTS.filter(function(z){return z.id==id})[0];return l?esc(l.name):'лот '+esc(id)},days=Object.keys(d.days).sort(),mx=Math.max.apply(null,days.map(function(x){return d.days[x]}).concat([1])),ids=Object.keys(d.lots).sort(function(a,b){return d.lots[b].view-d.lots[a].view}).slice(0,10);
    e.innerHTML='<p style="color:var(--ink)"><b>'+d.views+'</b> переглядів · <b>'+d.uniq+'</b> унікальних · <b>'+d.d7+'</b> за 7 днів · <b>'+d.d30+'</b> за 30 днів</p>'+
    '<div style="display:flex;align-items:flex-end;gap:4px;height:70px;max-width:420px">'+days.map(function(x){return '<div title="'+x+': '+d.days[x]+'" style="flex:1;background:var(--ink);opacity:.8;border-radius:6px 6px 0 0;height:'+Math.max(4,d.days[x]/mx*70)+'px"></div>'}).join('')+'</div>'+
    '<h3 style="color:var(--ink)">Топ лотів</h3>'+(ids.length?'<table style="border-collapse:collapse;font-size:14px;max-width:640px;width:100%"><tr class="mut"><td>Лот</td><td>Перегляди</td><td>У кошик</td><td>Замовлення</td></tr>'+ids.map(function(i){var z=d.lots[i];return '<tr style="border-top:1px solid var(--line);color:var(--ink)"><td>'+nm(i)+'</td><td>'+z.view+'</td><td>'+z.cart+'</td><td>'+z.order+'</td></tr>'}).join('')+'</table>':'<p>Поки немає даних.</p>')}).catch(function(){e.textContent='Не вдалося завантажити статистику. Перевірте URL у змінній STATS.'})}
function adminPage(a){
  var ok=false;try{ok=sessionStorage.getItem('adm')==ADMH}catch(e){}
  if(!ok){a.innerHTML='<h1>Вхід</h1><form class="form" id="pf"><label>Пароль<input type="password" id="pw" autocomplete="current-password" autofocus></label><button class="btn">Увійти</button><p class="warn" id="pe"></p></form>';
    document.getElementById('pf').onsubmit=function(e){e.preventDefault();sha(document.getElementById('pw').value).then(function(h){if(h==ADMH){try{sessionStorage.setItem('adm',h)}catch(e){}adminPage(a)}else document.getElementById('pe').textContent='Невірний пароль'})};return}
  alot=alot||S.LOTS[0].id;
